schema_version = "1.0.0"

id = "gn_toolkit"
name = "GNToolkit"
version = "0.2.4"
tagline = "Git-style version control for Geometry Nodes projects"
maintainer = "oobma <ambooart@gmail.com>"

type = "add-on"
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

website = "https://github.com/oobma/GNToolkit"
tags = ["Geometry Nodes", "Version Control", "JSON", "Collaboration", "Git", "Sync"]

[permissions]
files = "Read and write Geometry Nodes JSON package files, their lock files and temporary sibling files during atomic writes, plus the sync metadata sidecar ('.gntsync') next to the user's .blend file"
network = "Git push/pull/fetch against remote repositories for the collaboration features, including a silent fetch of tracked repositories when a .blend is opened — only when online access is enabled in Blender"