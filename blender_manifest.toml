schema_version = "1.0.0"

id = "gn_toolkit"
name = "GNToolkit"
version = "0.3.0"
tagline = "Version control with semantics for Blender node trees"
maintainer = "oobma <ambooart@gmail.com>"

type = "add-on"
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 oobma"]

website = "https://github.com/oobma/GNToolkit"
tags = ["Geometry Nodes", "Pipeline", "Node"]

wheels = [
    "./wheels/backports.tarfile-1.2.0-py3-none-any.whl",
    "./wheels/dulwich-1.2.17-py3-none-any.whl",
    "./wheels/importlib_metadata-9.0.1-py3-none-any.whl",
    "./wheels/jaraco.classes-3.4.0-py3-none-any.whl",
    "./wheels/jaraco_context-6.1.2-py3-none-any.whl",
    "./wheels/jaraco_functools-4.6.0-py3-none-any.whl",
    "./wheels/keyring-25.7.0-py3-none-any.whl",
    "./wheels/more_itertools-11.1.0-py3-none-any.whl",
    "./wheels/pywin32_ctypes-0.2.3-py3-none-any.whl",
    "./wheels/typing_extensions-4.16.0-py3-none-any.whl",
    "./wheels/urllib3-2.8.0-py3-none-any.whl",
    "./wheels/zipp-4.1.1-py3-none-any.whl",
]

[permissions]
files = "Read and write project JSON files and the .gntsync sidecar"
network = "Fetch, pull and push to the remotes you configure"